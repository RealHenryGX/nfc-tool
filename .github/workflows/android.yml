name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [build-android-apk]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze lib
      - run: flutter test
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: nfc-tool-release-apks
          path: build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error
      - name: Publish APKs to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          tag="android-build-${RUN_ID}-${RUN_ATTEMPT}"
          gh release create "$tag" build/app/outputs/flutter-apk/*-release.apk \
            --target "$BUILD_SHA" \
            --title "Android build ${RUN_ID}.${RUN_ATTEMPT}" \
            --prerelease \
            --notes "Automated release-mode build. Signed with the build runner's debug keystore; signatures can differ between builds. Back up app data before replacing an installation signed with another key."
